<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALPHOSYNTH</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a0a;--fg:#f0f0f0;--muted:#555;--accent:#e63946;
--cool:#457b9d;--warm:#f4a261;--dim:#1a1a1a;--knob-bg:#161616;
--knob-ring:#2a2a2a;--knob-hi:#c0392b;
}
html,body{height:100%;background:var(--bg);color:var(--fg);
font-family:'Courier New',Courier,monospace;overflow:hidden;
-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}

/* HEADER */
#hdr{display:flex;align-items:center;justify-content:space-between;
padding:8px 14px;background:var(--dim);border-bottom:1px solid #1f1f1f;
position:fixed;top:0;left:0;right:0;z-index:200}
#hdr h1{font-size:12px;letter-spacing:7px;font-weight:400;opacity:.9}
.hdr-ctrl{display:flex;align-items:center;gap:10px}
.lbl{font-size:8px;letter-spacing:2px;color:var(--muted)}
#pwr{width:30px;height:30px;border-radius:50%;border:1px solid #333;
background:transparent;color:var(--fg);font-size:13px;transition:all .2s;
display:flex;align-items:center;justify-content:center}
#pwr.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
#mv{width:70px;accent-color:var(--accent)}

/* VIS BAR */
#vis{position:fixed;top:47px;left:0;right:0;height:2px;background:#111;z-index:199}
#vis>div{height:100%;transition:width .25s;display:flex}
#vis span{display:inline-block;height:100%;width:20%}
.vcol0{background:#e63946}.vcol1{background:#457b9d}
.vcol2{background:#f4a261}.vcol3{background:#2a9d8f}.vcol4{background:#9b5de5}

/* LAYER TABS */
#tabs{display:flex;background:var(--dim);border-bottom:1px solid #1a1a1a;
position:fixed;top:49px;left:0;right:0;z-index:198}
.tab{flex:1;text-align:center;padding:7px 0;font-size:10px;letter-spacing:2px;
border:none;background:transparent;color:var(--muted);
border-bottom:2px solid transparent;transition:color .15s}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}

/* PARAM INFO BAR */
#pbar{position:fixed;bottom:88px;left:0;right:0;padding:5px 14px;
background:var(--dim);border-top:1px solid #1a1a1a;display:flex;
justify-content:space-between;font-size:9px;color:var(--muted);z-index:197}
#pname{letter-spacing:2px}#pval{color:var(--fg)}

/* MAIN KNOB AREA */
#main{margin-top:97px;height:calc(100vh - 182px);overflow-y:auto;padding:10px 6px;
display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}
@media(max-width:700px){#main{grid-template-columns:repeat(3,1fr)}}

/* KNOB CELL */
.kcell{display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:3px}
.knob{cursor:ns-resize;width:54px;height:54px;border-radius:50%;
background:var(--knob-bg);border:2px solid var(--knob-ring);
position:relative;touch-action:none;flex-shrink:0;transition:border-color .1s}
.knob:hover{border-color:#444}
.knob svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kval{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;font-size:8px;font-weight:700;
color:var(--accent);line-height:1.1}
.kval span{display:block}
.kname{font-size:7.5px;letter-spacing:1px;color:var(--muted);
text-align:center;line-height:1.2;max-width:60px;word-break:break-all}

/* KEYBOARD */
#kb{display:flex;justify-content:center;align-items:flex-end;gap:2px;
padding:10px;background:var(--dim);border-top:1px solid #1a1a1a;
position:fixed;bottom:0;left:0;right:0;z-index:200}
.key{width:34px;height:72px;background:var(--fg);border-radius:0 0 4px 4px;
border:1px solid #ccc;cursor:pointer;transition:background .05s;flex-shrink:0;
font-size:7px;display:flex;align-items:flex-end;justify-content:center;
padding-bottom:4px;font-family:inherit}
.key:hover{background:#ddd}
.key.on{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)}
.key.bk{width:22px;height:44px;background:#1c1c1c;z-index:2;
margin-left:-11px;margin-right:-11px;border-color:#0a0a0a}
.key.bk:hover{background:#2a2a2a}
@media(max-width:600px){
.key{width:26px;height:56px;font-size:6px}
.key.bk{width:16px;height:34px;margin-left:-8px;margin-right:-8px}
}

/* SELECT DROPDOWN */
.psel{display:none;flex-direction:column;gap:2px;
padding:5px;background:var(--dim);border:1px solid #333;min-width:58px}
.psel.open{display:flex;position:absolute;z-index:300}
.psel button{background:transparent;border:none;color:var(--fg);
font-size:8px;letter-spacing:1px;padding:4px 6px;text-align:left}
.psel button:hover{background:var(--accent)}

/* START SCREEN */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;
position:fixed;inset:0;background:var(--bg);z-index:500;gap:20px}
#start h1{font-size:22px;letter-spacing:12px;font-weight:400}
#start p{font-size:10px;color:var(--muted);letter-spacing:3px}
#start-btn{padding:12px 30px;background:var(--accent);border:none;
color:#fff;font-size:11px;letter-spacing:3px;cursor:pointer;
font-family:inherit;transition:opacity .2s}
#start-btn:hover{opacity:.8}
</style>
</head>
<body>

<div id="hdr">
  <h1>ALPHOSYNTH</h1>
  <div class="hdr-ctrl">
    <span class="lbl">MASTER</span>
    <input type="range" id="mv" min="0" max="100" value="75">
    <button id="pwr">&#9654;</button>
  </div>
</div>
<div id="vis"><div id="visi"></div></div>
<div id="tabs">
  <button class="tab active" data-i="0">L1</button>
  <button class="tab" data-i="1">L2</button>
  <button class="tab" data-i="2">L3</button>
  <button class="tab" data-i="3">L4</button>
  <button class="tab" data-i="4">L5</button>
</div>
<div id="main"></div>
<div id="pbar"><span id="pname">NOISE COLOR</span><span id="pval">800 Hz</span></div>
<div id="kb"></div>

<div id="start">
  <h1>ALPHOSYNTH</h1>
  <p>EXPLORATIVE NOISE POLYSYNTH</p>
  <button id="start-btn">INITIALISE</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════
// PARAM DEFINITIONS
// ═══════════════════════════════════════════
const PARAMS = [
  {n:'NOISE COLOR',   u:'Hz',  mn:20,   mx:20000,  df:800,   ep:true,  sel:null},
  {n:'NOISE BLEND',  u:'',    mn:0,    mx:100,    df:50,   ep:false, sel:null},
  {n:'HARMONICITY',  u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
  {n:'GRAIN SIZE',   u:'ms',  mn:1,    mx:200,    df:40,   ep:false, sel:null},
  {n:'GRAIN DENSITY',u:'/s',  mn:1,    mx:100,    df:20,   ep:false, sel:null},
  {n:'GRAIN PITCH',  u:'st',  mn:-24,  mx:24,     df:0,    ep:false, sel:null},
  {n:'FILTER MODE',  u:'',    mn:0,    mx:3,      df:0,   ep:false, sel:['LP','BP','HP','NT']},
  {n:'FILTER FREQ',  u:'Hz',  mn:20,   mx:20000,  df:2500, ep:true,  sel:null},
  {n:'FILTER RESO',  u:'%',   mn:0,    mx:100,    df:15,   ep:false, sel:null},
  {n:'FILTER FM',    u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'WAVESHAPE',    u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'WAVE SYM',    u:'%',   mn:-100, mx:100,    df:0,    ep:false, sel:null},
  {n:'LFO RATE',    u:'Hz',   mn:0.02, mx:50,     df:1.0,  ep:false, sel:null},
  {n:'LFO DEPTH',   u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'LFO TARGET',  u:'',     mn:0,    mx:2,      df:0,   ep:false, sel:['PIT','FLT','AMP']},
  {n:'MOD ENV',     u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
  {n:'DELAY TIME',  u:'ms',   mn:10,   mx:2000,   df:200,  ep:false, sel:null},
  {n:'DELAY FDBK',  u:'%',   mn:0,    mx:95,     df:40,   ep:false, sel:null},
  {n:'REVERB SIZE', u:'%',   mn:0,    mx:100,    df:50,   ep:false, sel:null},
  {n:'REVERB MIX',  u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
];

// ═══════════════════════════════════════════
// AUDIO UTILITIES
// ═══════════════════════════════════════════
function hz(v,mn,mx){return mn+(mx-mn)*Math.pow(Math.max(v,1)/mx,0.5)}

function makeDistCurve(depth,sym){
  const N=256,c=new Float32Array(N);
  const k=depth*200;
  for(let i=0;i<N;i++){
    const x=(i*2)/N-1;
    let y=Math.tanh(k*x);
    y+=Math.sin(x*Math.PI*2)*k*0.04*((100+sym)/100);
    y+=Math.sin(x*Math.PI*3)*k*0.02*((100-sym)/100);
    c[i]=Math.max(-1,Math.min(1,y/(1+k*0.08)));
  }
  return c;
}

function makeNoiseBuf(ctx,dur){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  return b;
}

// Pink noise via IIR approximation (Voss-McCartney)
function makePinkBuf(ctx,dur){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){
    const w=(Math.random()*2-1);
    b0=0.99886*b0+w*0.0555179;
    b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520;
    b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522;
    b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  return b;
}

// ═══════════════════════════════════════════
// REVERB (Schroeder reverb)
// ═══════════════════════════════════════════
class Reverb {
  constructor(ctx){
    this.ctx=ctx;
    this.out=ctx.createGain();
    this.wet=ctx.createGain();this.wet.gain.value=0.3;
    this.dry=ctx.createGain();this.dry.gain.value=0.7;
    this.wet.connect(this.out);
    this.dry.connect(this.out);
    this.allpasses=[];
    this.combs=[];
    const allT=[0.0017,0.0023,0.0031,0.0037,0.0041];
    allT.forEach(t=>{
      const ap=new Allpass(ctx,t);
      this.allpasses.push(ap);
    });
    const cT=[0.029,0.037,0.041,0.043];
    cT.forEach(t=>{this.combs.push(new Comb(ctx,t));});
    this.combs[0].fb.gain.value=0.7;
    this.combs[1].fb.gain.value=0.72;
    this.combs[2].fb.gain.value=0.74;
    this.combs[3].fb.gain.value=0.76;
    const mix=ctx.createGain();mix.gain.value=0.5;
    this.allpasses.forEach(a=>{a.out.connect(mix);});
    mix.connect(this.out);
  }
  process(i){
    // i is the wet delay signal — route it through reverb chain
    this.allpasses[0].out.connect(this.allpasses[1]);
    this.allpasses[1].out.connect(this.allpasses[2]);
    this.allpasses[2].out.connect(this.allpasses[3]);
    this.allpasses[3].out.connect(this.allpasses[4]);
    this.allpasses[4].out.connect(this.out);
    i.connect(this.allpasses[0]); // feed delay wet into reverb
    return this.out;
  }
  setDecay(s){
    const base=0.4+s*0.55;
    this.combs.forEach((c,i)=>{c.fb.gain.value=Math.min(0.97,base+i*0.01);});
  }
  setMix(w){
    this.wet.gain.setTargetAtTime(w,this.ctx.currentTime,0.05);
    this.dry.gain.setTargetAtTime(1-w,this.ctx.currentTime,0.05);
  }
  connect(d){this.out.connect(d);}
}

class Comb {
  constructor(ctx,t){
    this.ctx=ctx;
    this.dl=ctx.createDelay(1);this.dl.delayTime.value=t;
    this.fb=ctx.createGain();this.fb.gain.value=0.7;
    this.out=ctx.createGain();
    this.dl.connect(this.fb);this.fb.connect(this.dl);
    this.dl.connect(this.out);
  }
  link(){}
}

class Allpass {
  constructor(ctx,t){
    this.ctx=ctx;
    this.dl=ctx.createDelay(1);this.dl.delayTime.value=t;
    this.g=ctx.createGain();this.g.gain.value=-0.7;
    this.out=ctx.createGain();
    this.dl.connect(this.g);this.g.connect(this.out);
    this.dl.connect(this.out);
  }
}

// ═══════════════════════════════════════════
// LAYER VOICE
// ═══════════════════════════════════════════
class Layer {
  constructor(ctx,master,i){
    this.ctx=ctx;this.master=master;this.idx=i;
    this.p=PARAMS.map(x=>x.df);
    this.act=0;
    this._build();
  }

  _build(){
    const c=this.ctx;
    // Sources
    this.noiseA=c.createBufferSource();
    this.noiseA.buffer=makeNoiseBuf(c,4);
    this.noiseA.loop=true;

    this.noiseB=c.createBufferSource();
    this.noiseB.buffer=makePinkBuf(c,4);
    this.noiseB.loop=true;

    // Mix gains for noise blend
    this.gA=c.createGain();this.gA.gain.value=0.8;
    this.gB=c.createGain();this.gB.gain.value=0.2;

    // Shaping filter (color)
    this.shaper=c.createBiquadFilter();
    this.shaper.type='bandpass';this.shaper.frequency.value=800;this.shaper.Q.value=1.5;

    // Waveshaper
    this.ws=c.createWaveShaper();
    this.ws.curve=makeDistCurve(0,0);this.ws.oversample='4x';

    // Main filter
    this.flt=c.createBiquadFilter();
    this.flt.type='lowpass';this.flt.frequency.value=2500;this.flt.Q.value=0.5;

    // LFO
    this.lfoO=c.createOscillator();this.lfoO.type='sine';this.lfoO.frequency.value=1;
    this.lfoG=c.createGain();this.lfoG.gain.value=0;
    this.lfoO.connect(this.lfoG);this.lfoO.start();

    // Envelope for filter modulation
    this.fltEnv=c.createGain();this.fltEnv.gain.value=1;
    this.lfoG.connect(this.fltEnv);
    this.fltEnv.connect(this.flt.frequency);

    // Amp envelope
    this.env=c.createGain();this.env.gain.value=0;

    // Delay
    this.dly=c.createDelay(2);this.dly.delayTime.value=0.2;
    this.dlyFb=c.createGain();this.dlyFb.gain.value=0.4;
    this.dlyW=c.createGain();this.dlyW.gain.value=0.25;
    this.dlyD=c.createGain();this.dlyD.gain.value=0.75;
    this.dly.connect(this.dlyFb);this.dlyFb.connect(this.dly);
    this.dly.connect(this.dlyW);

    // Reverb (Schroeder: 4 combs + 2 allpasses, all connected)
    this.revOut=this.ctx.createGain();this.revOut.gain.value=0.3;
    this.revFb=this.ctx.createGain();this.revFb.gain.value=0.5;
    this.revWet=this.ctx.createGain();this.revWet.gain.value=0.5;

    // Comb filters (parallel) - stored fb refs
    this.rc1=this.ctx.createDelay(1);this.rc1.delayTime.value=0.029;
    this.rc2=this.ctx.createDelay(1);this.rc2.delayTime.value=0.037;
    this.rc3=this.ctx.createDelay(1);this.rc3.delayTime.value=0.041;
    this.rc4=this.ctx.createDelay(1);this.rc4.delayTime.value=0.043;
    this.rc1fb=this.ctx.createGain();this.rc1fb.gain.value=0.7;
    this.rc2fb=this.ctx.createGain();this.rc2fb.gain.value=0.72;
    this.rc3fb=this.ctx.createGain();this.rc3fb.gain.value=0.74;
    this.rc4fb=this.ctx.createGain();this.rc4fb.gain.value=0.76;
    this.rc1.connect(this.rc1fb);this.rc1fb.connect(this.rc1);
    this.rc2.connect(this.rc2fb);this.rc2fb.connect(this.rc2);
    this.rc3.connect(this.rc3fb);this.rc3fb.connect(this.rc3);
    this.rc4.connect(this.rc4fb);this.rc4fb.connect(this.rc4);

    // Allpass (series)
    this.ra1=this.ctx.createDelay(1);this.ra1.delayTime.value=0.0031;
    this.ra2=this.ctx.createDelay(1);this.ra2.delayTime.value=0.005;
    this.ra1.connect(this.ra2);

    // Sum combs → allpasses → revOut
    const cs=this.ctx.createGain();cs.gain.value=1;
    this.rc1fb.connect(cs);this.rc2fb.connect(cs);
    this.rc3fb.connect(cs);this.rc4fb.connect(cs);
    cs.connect(this.ra1);
    this.ra1.connect(this.ra2);this.ra2.connect(this.revOut);

// Grain LFO (amplitude modulation for grain texture)
    this.grO=this.ctx.createOscillator();this.grO.frequency.value=20;
    this.grG=this.ctx.createGain();this.grG.gain.value=0;
    this.grO.connect(this.grG);this.grO.start();

    // OUTPUT
    this.out=c.createGain();this.out.gain.value=1;

    // Connect chain
    this.noiseA.connect(this.gA);
    this.noiseB.connect(this.shaper);this.shaper.connect(this.gB);
    this.gA.connect(this.ws);
    this.gB.connect(this.ws);
    this.ws.connect(this.flt);
    this.flt.connect(this.env);
    this.env.connect(this.dlyD);
    this.env.connect(this.dlyW);
    this.dlyD.connect(this.out);
    this.dlyW.connect(this.revWet);this.revWet.connect(this.revOut);
    this.revOut.connect(this.out);
    this.out.connect(this.master);
  }

  _updParams(t){
    const p=this.p;
    // Noise blend
    const blend=p[1]/100;
    const naGain=Math.sqrt(1-blend);
    const nbGain=Math.sqrt(blend);
    this.gA.gain.setTargetAtTime(naGain,t,0.05);
    this.gB.gain.setTargetAtTime(nbGain,t,0.05);

    // Noise color / harmonity
    const nc=hz(p[0],20,20000);
    const harm=p[2]/100;
    this.shaper.frequency.setTargetAtTime(nc*(1+harm*0.5),t,0.05);
    this.shaper.Q.setTargetAtTime(0.5+harm*5,t,0.05);

    // Grain AM
    this.grO.frequency.setTargetAtTime(p[4],t,0.05);
    const gs=p[3]/200;
    this.grG.gain.setTargetAtTime(gs,t,0.05);

    // Waveshaper
    this.ws.curve=makeDistCurve(p[10]/100,p[11]);

    // Filter
    const ftypes=['lowpass','bandpass','highpass','notch'];
    this.flt.type=ftypes[Math.floor(p[6])]||'lowpass';
    this.flt.frequency.setTargetAtTime(hz(p[7],20,20000),t,0.03);
    this.flt.Q.setTargetAtTime(0.3+p[8]/12,t,0.03);

    // Filter FM from LFO
    const lfoTarget=Math.floor(p[14]);
    const lfoDepth=p[13]/100;
    const fc=hz(p[7],20,20000);
    if(lfoTarget===1){this.lfoG.gain.setTargetAtTime(lfoDepth*fc*0.5,t,0.05);}
    else{this.lfoG.gain.setTargetAtTime(0,t,0.05);}

    // LFO rate
    this.lfoO.frequency.setTargetAtTime(Math.max(0.01,p[12]),t,0.05);

    // LFO pitch routing
    if(lfoTarget===0&&lfoDepth>0){
      this.lfoG.connect(this.shaper.frequency);
    } else {
      try{this.lfoG.disconnect(this.shaper.frequency);}catch(e){}
    }

    // Delay
    this.dly.delayTime.setTargetAtTime(p[16]/1000,t,0.05);
    this.dlyFb.gain.setTargetAtTime(p[17]/100*0.95,t,0.05);
    this.dlyW.gain.setTargetAtTime(p[17]/80,t,0.05);

    // Reverb
    const rs=p[18]/100;
    const cf=0.3+rs*0.65;
    this.rc1fb.gain.setTargetAtTime(cf,this.ctx.currentTime,0.05);
    this.rc2fb.gain.setTargetAtTime(cf+0.01,this.ctx.currentTime,0.05);
    this.rc3fb.gain.setTargetAtTime(cf+0.02,this.ctx.currentTime,0.05);
    this.rc4fb.gain.setTargetAtTime(cf+0.03,this.ctx.currentTime,0.05);
    this.revWet.gain.setTargetAtTime(p[19]/100*0.8,this.ctx.currentTime,0.05);
    this.revOut.gain.setTargetAtTime(0.2+rs*0.6,this.ctx.currentTime,0.05);
  }

  _noteOn(vel){
    this.act=1;
    const c=this.ctx,t=c.currentTime;

    // restart noise sources
    this.noiseA.stop();this.noiseA.buffer=makeNoiseBuf(c,4);
    this.noiseA.connect(this.gA);this.noiseA.start();
    this.noiseB.stop();this.noiseB.buffer=makePinkBuf(c,4);
    this.noiseB.connect(this.shaper);this.noiseB.start();

    this._updParams(t);

    // Amp envelope
    this.env.gain.cancelScheduledValues(t);
    this.env.gain.setValueAtTime(0,t);
    this.env.gain.linearRampToValueAtTime(vel*0.12,t+0.008);
    this.env.gain.exponentialRampToValueAtTime(0.0001,t+1.2);

    // Re-trigger LFO for fresh phase
    try{this.lfoO.stop();}catch(e){}
    this.lfoO=this.ctx.createOscillator();this.lfoO.type='sine';
    this.lfoO.frequency.value=this.p[12];
    this.lfoG=this.ctx.createGain();this.lfoG.gain.value=0;
    this.lfoO.connect(this.lfoG);this.lfoO.start();
    this.lfoG.connect(this.fltEnv);
    // Reconnect filter FM
    const lfoTarget=Math.floor(this.p[14]);
    if(lfoTarget===1){
      const fc=hz(this.p[7],20,20000);
      this.lfoG.gain.value=this.p[13]/100*fc*0.5;
    }

    // Re-trigger grain LFO
    try{this.grO.stop();}catch(e){}
    this.grO=this.ctx.createOscillator();
    this.grO.frequency.value=this.p[4];
    this.grG=this.ctx.createGain();this.grG.gain.value=this.p[3]/200;
    this.grO.connect(this.grG);this.grO.start();
    this.grG.connect(this.env.gain);
  }

  _noteOff(){
    this.act=0;
    const c=this.ctx,t=c.currentTime;
    this.env.gain.cancelScheduledValues(t);
    this.env.gain.setValueAtTime(this.env.gain.value,t);
    this.env.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
  }

  setP(i,v){
    this.p[i]=v;
    if(this.act)this._updParams(this.ctx.currentTime);
  }
}

// ═══════════════════════════════════════════
// SYNTH ENGINE
// ═══════════════════════════════════════════
class Alphosynth {
  constructor(){
    this.ctx=null;this.master=null;this.layers=[];
    this.cur=0;this.on=false;
    this.notes=new Map();
    this._buildUI();
  }

  async init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain();this.master.gain.value=0.75;
    this.master.connect(this.ctx.destination);
    for(let i=0;i<5;i++)this.layers.push(new Layer(this.ctx,this.master,i));
  }

  _start(){
    if(this.on)return;
    this.init();
    if(this.ctx.state==='suspended')this.ctx.resume();
    this.on=true;
    document.getElementById('pwr').classList.add('on');
    document.getElementById('kb').style.display='flex';
    document.getElementById('main').style.display='grid';
    this.layers.forEach(l=>l._updParams(this.ctx.currentTime));
  }

  _stop(){
    if(!this.ctx)return;
    this.notes.forEach((_,n)=>this._noteOff(n));
    this.on=false;
    document.getElementById('pwr').classList.remove('on');
  }

  _noteOn(n,vel=0.65){
    if(!this.on)return;
    const li=this.cur++%5;
    this.layers[li]._noteOn(vel);
    this.notes.set(n,li);
    this._updateVis();
  }

  _noteOff(n){
    if(!this.on)return;
    const li=this.notes.get(n);
    if(li!==undefined){this.layers[li]._noteOff();this.notes.delete(n);}
    this._updateVis();
  }

  setP(li,i,v){this.layers[li].setP(i,v);}

  setMaster(v){
    if(this.master)this.master.gain.setTargetAtTime(v/100,this.ctx.currentTime,0.03);
  }

  _updateVis(){
    const c=[0,0,0,0,0];
    this.notes.forEach(li=>c[li]++);
    const visi=document.getElementById('visi');
    if(!visi)return;
    const cols=['vcol0','vcol1','vcol2','vcol3','vcol4'];
    visi.innerHTML=c.map((v,i)=>`<span class="${cols[i]}" style="flex:${v||0.1}"></span>`).join('');
  }

  // ─── UI ─────────────────────────────────────
  _buildUI(){
    const grid=document.getElementById('main');
    grid.innerHTML='';

    PARAMS.forEach((pr,i)=>{
      const cell=document.createElement('div');cell.className='kcell';
      const k=document.createElement('div');k.className='knob';k.dataset.i=i;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 54 54');
      svg.innerHTML=`<circle cx="27" cy="27" r="24" fill="none" stroke="#222" stroke-width="3"/>
        <circle id="a${i}" cx="27" cy="27" r="24" fill="none" stroke="#e63946" stroke-width="3"
          stroke-dasharray="0 150.8" transform="rotate(-135 27 27)" stroke-linecap="round"/>`;
      k.appendChild(svg);
      const kv=document.createElement('div');kv.className='kval';
      kv.id=`v${i}`;kv.innerHTML='<span></span>';
      k.appendChild(kv);
      const kn=document.createElement('div');kn.className='kname';
      kn.id=`n${i}`;kn.textContent=pr.n;
      cell.appendChild(k);cell.appendChild(kn);
      grid.appendChild(cell);

      // param bar
      cell.addEventListener('mouseenter',()=>{
        document.getElementById('pname').textContent=pr.n;
        this._updPD(i);
      });

      // discrete selector
      if(pr.sel){
        k.addEventListener('dblclick',()=>this._openSel(k,i));
      }

      // knob drag
      this._dragKnob(k,i);
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(t=>{
      t.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        this._refreshKnobs(+t.dataset.i);
      });
    });

    // Power
    document.getElementById('pwr').addEventListener('click',()=>{
      this.on?this._stop():this._start();
    });

    // Master vol
    document.getElementById('mv').addEventListener('input',e=>{
      this.setMaster(+e.target.value);
    });

    // Start button
    document.getElementById('start-btn').addEventListener('click',()=>{
      document.getElementById('start').style.display='none';
      this._start();
      // Show vis
      document.getElementById('vis').style.display='block';
    });

    // Keyboard
    this._buildKB();

    // Init vis bar
    this._updateVis();
  }

  _openSel(k,i){
    document.querySelectorAll('.psel').forEach(s=>s.remove());
    const pr=PARAMS[i],sel=document.createElement('div');
    sel.className='psel open';sel.style.position='absolute';
    pr.sel.forEach((o,vi)=>{
      const btn=document.createElement('button');
      btn.textContent=o;
      btn.addEventListener('click',()=>{
        this.setP(this._curL(),i,vi);
        this._refreshKnobs(this._curL());
        sel.remove();
      });
      sel.appendChild(btn);
    });
    k.parentElement.appendChild(sel);
    setTimeout(()=>{document.addEventListener('click',function h(e){
      if(!sel.contains(e.target)){sel.remove();document.removeEventListener('click',h);}
    });},10);
  }

  _curL(){return+document.querySelector('.tab.active').dataset.i}

  _dragKnob(el,i){
    let dy=0,v=0,dragging=false;
    const rng=PARAMS[i].mx-PARAMS[i].mn;
    const getV=()=>this.layers[this._curL()].p[i];

    el.addEventListener('mousedown',e=>{dragging=true;dy=e.clientY;v=getV();e.preventDefault();});
    el.addEventListener('touchstart',e=>{dragging=true;dy=e.touches[0].clientY;v=getV();e.preventDefault();},{passive:false});
    682|    window.addEventListener('mousemove',e=>{if(!dragging)return;
    683|      const d=dy-e.clientY,ns=e.shiftKey?0.0005:0.002;
    684|      let nv=Math.max(0,Math.min(1,(v-PARAMS[i].mn)/rng+d*ns*rng));
    685|      nv=Math.round(nv*rng/PARAMS[i].df)*PARAMS[i].df;
    686|      nv=Math.max(PARAMS[i].mn,Math.min(PARAMS[i].mx,nv));
    687|      this.setP(this._curL(),i,nv);
    688|      this._refreshKnob(i);
    689|      this._updPD(i);
    690|    });
    691|    window.addEventListener('touchmove',e=>{if(!dragging)return;
    692|      const d=dy-e.touches[0].clientY,ns=0.002;
    693|      let nv=Math.max(0,Math.min(1,(v-PARAMS[i].mn)/rng+d*ns*rng));
      this.setP(this._curL(),i,nv);
      this._refreshKnob(i);
      this._updPD(i);
    },{passive:false});
    window.addEventListener('mouseup',()=>dragging=false);
    window.addEventListener('touchend',()=>dragging=false);
  }

  _refreshKnobs(li){
    PARAMS.forEach((_,i)=>this._refreshKnob(i));
  }

  _refreshKnob(i){
    const pr=PARAMS[i],li=this._curL(),v=this.layers[li].p[i];
    const norm=(v-pr.mn)/(pr.mx-pr.mn);
    const arc=document.getElementById(`a${i}`);
    if(arc){
      const len=norm*113.1; // 270° arc = 113.1 for r=24
      arc.setAttribute('stroke-dasharray',`${len} 150.8`);
      arc.setAttribute('stroke',pr.sel?'#457b9d':'#e63946');
    }
    const kv=document.getElementById(`v${i}`);
    if(kv){
      if(pr.sel)kv.innerHTML=`<span>${pr.sel[Math.round(v)]||''}</span>`;
      else{
        if(pr.mx>=10000)kv.innerHTML=`<span>${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</span>`;
        else if(pr.mx<1)kv.innerHTML=`<span>${v.toFixed(2)}</span>`;
        else kv.innerHTML=`<span>${Math.round(v*10)/10}</span>`;
      }
    }
  }

  _updPD(i){
    const pr=PARAMS[i],li=this._curL(),v=this.layers[li].p[i];
    const pv=document.getElementById('pval');
    if(pr.sel)pv.textContent=pr.sel[Math.round(v)]||'';
    else{
      let s='';
      if(pr.mx>=1000&&v>=1000)s=(v/1000).toFixed(1)+'k';
      else if(pr.mx<1)s=v.toFixed(2);
      else s=Math.round(v*10)/10;
      pv.textContent=s+(pr.u?' '+pr.u:'');
    }
  }

  _buildKB(){
    const kb=document.getElementById('kb');
    // 2 octaves C3-B4 = MIDI 48-71
    const wn=[0,2,4,5,7,9,11,12,14,16,17,19,21,23]; // relative to 48
    const bn=[1,3,6,8,10,13,15,18,20,22];
    bn.forEach(o=>{
      const b=document.createElement('button');b.className='key bk';b.dataset.m=48+o;
      kb.appendChild(b);this._keyListeners(b);
    });
    wn.forEach(o=>{
      const b=document.createElement('button');b.className='key';b.dataset.m=48+o;
      kb.appendChild(b);this._keyListeners(b);
    });

    // QWERTY
    const map={
      'a':48,'w':49,'s':50,'e':51,'d':52,'f':53,'t':54,'g':55,
      'y':56,'h':57,'u':58,'j':59,'k':60,'o':61,'l':62,'p':63,
      ';':64,"'":65,'[':66,']':67,'\\':68
    };
    window.addEventListener('keydown',e=>{
      if(e.repeat||e.target.tagName==='INPUT')return;
      const m=map[e.key.toLowerCase()];
      if(m!==undefined){
        const b=kb.querySelector(`[data-m="${m}"]`);
        if(b&&!b.classList.contains('on')){b.classList.add('on');this._noteOn(m-48);}
      }
    });
    window.addEventListener('keyup',e=>{
      const m=map[e.key.toLowerCase()];
      if(m!==undefined){
        const b=kb.querySelector(`[data-m="${m}"]`);
        if(b){b.classList.remove('on');this._noteOff(m-48);}
      }
    });
  }

  _keyListeners(b){
    const dn=(e)=>{
      const vel=e&&e.touches?0.7:0.4+(1-(e?e.clientY:0)/window.innerHeight)*0.5;
      b.classList.add('on');
      this._noteOn(+b.dataset.m-48,Math.max(0.3,Math.min(1,vel)));
    };
    const up=()=>{b.classList.remove('on');this._noteOff(+b.dataset.m-48);};
    b.addEventListener('mousedown',e=>{e.preventDefault();dn(e);});
    b.addEventListener('touchstart',e=>{e.preventDefault();dn(e);},{passive:false});
    b.addEventListener('mouseup',up);
    b.addEventListener('mouseleave',up);
    b.addEventListener('touchend',up);
  }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
const synth=new Alphosynth();
window.synth=synth;
</script>
