<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALPHOSYNTH</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--fg:#e8e8e8;--muted:#888;--accent:#e63946;
  --cool:#457b9d;--warm:#f4a261;--dim:#151515;--knob-bg:#1c1c1c;
  --knob-ring:#333;--panel:#111;
}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font-family:'Courier New',Courier,monospace;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}

/* HEADER */
#hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid #222;
  position:fixed;top:0;left:0;right:0;z-index:200}
#hdr h1{font-size:11px;letter-spacing:8px;font-weight:400;opacity:.95;color:#ccc}
.hdr-right{display:flex;align-items:center;gap:12px}
.lbl{font-size:8px;letter-spacing:2.5px;color:var(--muted)}
#mv{width:64px;accent-color:var(--accent)}

/* POWER BUTTON — clearer, bottom-center */
#pwr-btn{
  padding:7px 16px;background:transparent;border:1px solid #444;
  color:#aaa;font-size:9px;letter-spacing:3px;transition:all .2s;
  border-radius:2px;
}
#pwr-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 0 10px rgba(230,57,70,.4)}

/* VIS BAR */
#vis{position:fixed;top:49px;left:0;right:0;height:2px;background:#111;z-index:199}
#vis>div{height:100%;transition:width .2s}
#vis span{display:inline-block;height:100%;width:20%}
.vcol0{background:#e63946}.vcol1{background:#457b9d}
.vcol2{background:#f4a261}.vcol3{background:#2a9d8f}.vcol4{background:#9b5de5}

/* LAYER TABS — labeled clearly */
#tabs{display:flex;background:var(--panel);border-bottom:1px solid #1f1f1f;
  position:fixed;top:51px;left:0;right:0;z-index:198}
.tab{flex:1;text-align:center;padding:9px 0;font-size:9.5px;letter-spacing:1.5px;
  border:none;background:transparent;color:var(--muted);
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab.active{color:#ccc;border-bottom-color:var(--accent)}
.tab:hover{color:#bbb}

/* MAIN CONTENT */
#main{margin-top:103px;height:calc(100vh - 230px);overflow-y:auto;padding:12px 8px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start}
@media(max-width:700px){#main{grid-template-columns:repeat(3,1fr)}}

/* PARAM INFO BAR */
#pbar{position:fixed;bottom:100px;left:0;right:0;padding:6px 16px;
  background:var(--panel);border-top:1px solid #1a1a1a;display:flex;
  justify-content:space-between;font-size:9px;color:var(--muted);z-index:197}
#pname{letter-spacing:2px}#pval{color:#ccc;letter-spacing:1px}

/* KNOB CELL */
.kcell{display:flex;flex-direction:column;align-items:center;padding:5px 2px;gap:4px}
.knob{cursor:ns-resize;width:52px;height:52px;border-radius:50%;
  background:var(--knob-bg);border:2px solid var(--knob-ring);
  position:relative;touch-action:none;flex-shrink:0;transition:border-color .1s}
.knob:hover{border-color:#555}
.knob svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kval{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:7.5px;font-weight:700;
  color:var(--accent);line-height:1.1;pointer-events:none}
.kval span{display:block}
.kname{font-size:7px;letter-spacing:1px;color:var(--muted);
  text-align:center;line-height:1.2;max-width:62px;word-break:break-all}

/* TRIGGER GRID (replaces keyboard) */
#triggers{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--panel);border-top:1px solid #1f1f1f;
  z-index:200;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
.trig-row{display:flex;justify-content:center;gap:5px}
.trig-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.trig-cell span{font-size:7px;color:var(--muted);letter-spacing:1px}
.trig{
  width:46px;height:40px;background:#1c1c1c;border:1px solid #2a2a2a;
  border-radius:3px;cursor:pointer;transition:background .06s,border-color .06s;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;color:#555;letter-spacing:1px;position:relative;overflow:hidden}
.trig:hover{background:#222;border-color:#3a3a3a}
.trig.firing{background:var(--accent);border-color:var(--accent);color:#fff}

/* Step sequencer */
#seq{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--panel);border-top:1px solid #1f1f1f;
  z-index:200;padding:8px 10px 10px;display:none;flex-direction:column;gap:5px}
#seq.visible{display:flex}
.seq-row{display:flex;align-items:center;gap:4px}
.seq-label{font-size:7px;color:var(--muted);width:28px;letter-spacing:1px;text-align:right;flex-shrink:0}
.seq-step{
  width:28px;height:28px;border:1px solid #2a2a2a;border-radius:2px;
  background:#151515;cursor:pointer;transition:all .08s;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.seq-step.active{background:var(--accent);border-color:var(--accent)}
.seq-step.playhead{outline:1px solid #fff;outline-offset:-1px}
#seq-controls{display:flex;justify-content:center;gap:8px;padding-top:4px}
#seq-controls button{
  padding:5px 12px;background:transparent;border:1px solid #333;
  color:#aaa;font-size:8px;letter-spacing:2px;cursor:pointer;border-radius:2px}
#seq-controls button:hover{border-color:var(--accent);color:#fff}

/* MODE TOGGLE */
#mode-bar{
  position:fixed;bottom:175px;left:0;right:0;
  background:var(--panel);border-top:1px solid #1a1a1a;
  padding:5px 16px;display:flex;justify-content:center;gap:8px;z-index:197}
#mode-bar button{
  padding:4px 10px;background:transparent;border:1px solid #2a2a2a;
  color:var(--muted);font-size:8px;letter-spacing:2px;cursor:pointer;border-radius:2px}
#mode-bar button.active{border-color:var(--accent);color:#ccc}

/* SELECT DROPDOWN */
.psel{display:none;flex-direction:column;gap:2px;
  padding:5px;background:var(--dim);border:1px solid #333;min-width:58px;z-index:300}
.psel.open{display:flex;position:absolute}
.psel button{background:transparent;border:none;color:var(--fg);
  font-size:8px;letter-spacing:1px;padding:4px 6px;text-align:left}
.psel button:hover{background:var(--accent)}

/* START SCREEN */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:fixed;inset:0;background:var(--bg);z-index:500;gap:24px}
#start h1{font-size:20px;letter-spacing:14px;font-weight:400;color:#ccc}
#start p{font-size:9px;color:var(--muted);letter-spacing:4px}
#start-btn{padding:13px 36px;background:var(--accent);border:none;
  color:#fff;font-size:11px;letter-spacing:4px;cursor:pointer;
  font-family:inherit;transition:opacity .2s;border-radius:2px}
#start-btn:hover{opacity:.8}
</style>
</head>
<body>

<div id="hdr">
  <h1>ALPHOSYNTH</h1>
  <div class="hdr-right">
    <span class="lbl">MASTER</span>
    <input type="range" id="mv" min="0" max="100" value="75">
  </div>
</div>
<div id="vis"><div id="visi"></div></div>
<div id="tabs">
  <button class="tab active" data-i="0">Layer 1</button>
  <button class="tab" data-i="1">Layer 2</button>
  <button class="tab" data-i="2">Layer 3</button>
  <button class="tab" data-i="3">Layer 4</button>
  <button class="tab" data-i="4">Layer 5</button>
</div>
<div id="main"></div>
<div id="pbar"><span id="pname">NOISE COLOR</span><span id="pval">800 Hz</span></div>

<div id="mode-bar">
  <button id="mode-trig" class="active">TRIG</button>
  <button id="mode-seq">SEQ</button>
</div>

<div id="triggers">
  <div class="trig-row" id="trig-row-0"></div>
  <div class="trig-row" id="trig-row-1"></div>
  <div class="trig-row" id="trig-row-2"></div>
  <div class="trig-row" id="trig-row-3"></div>
</div>

<div id="seq">
  <div id="seq-grid"></div>
  <div id="seq-controls">
    <button id="seq-clear">CLEAR</button>
    <button id="seq-play">&#9654; PLAY</button>
    <button id="seq-stop">&#9632; STOP</button>
  </div>
</div>

<button id="pwr-btn">AUDIO ON</button>

<div id="start">
  <h1>ALPHOSYNTH</h1>
  <p>EXPLORATIVE NOISE POLYSYNTH</p>
  <button id="start-btn">INITIALISE</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════
// PARAM DEFINITIONS
// ═══════════════════════════════════════════
const PARAMS = [
  {n:'NOISE COLOR',   u:'Hz',  mn:20,   mx:20000,  df:800,   ep:true,  sel:null},
  {n:'NOISE BLEND',  u:'',    mn:0,    mx:100,    df:50,   ep:false, sel:null},
  {n:'HARMONICITY',  u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
  {n:'GRAIN SIZE',   u:'ms',  mn:1,    mx:200,    df:40,   ep:false, sel:null},
  {n:'GRAIN DENSITY',u:'/s',  mn:1,    mx:100,    df:20,   ep:false, sel:null},
  {n:'GRAIN PITCH',  u:'st',  mn:-24,  mx:24,     df:0,    ep:false, sel:null},
  {n:'FILTER MODE',  u:'',    mn:0,    mx:3,      df:0,   ep:false, sel:['LP','BP','HP','NT']},
  {n:'FILTER FREQ',  u:'Hz',  mn:20,   mx:20000,  df:2500, ep:true,  sel:null},
  {n:'FILTER RESO',  u:'%',   mn:0,    mx:100,    df:15,   ep:false, sel:null},
  {n:'FILTER FM',    u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'WAVESHAPE',    u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'WAVE SYM',    u:'%',   mn:-100, mx:100,    df:0,    ep:false, sel:null},
  {n:'LFO RATE',    u:'Hz',   mn:0.02, mx:50,     df:1.0,  ep:false, sel:null},
  {n:'LFO DEPTH',   u:'%',   mn:0,    mx:100,    df:0,    ep:false, sel:null},
  {n:'LFO TARGET',  u:'',     mn:0,    mx:2,      df:0,   ep:false, sel:['PIT','FLT','AMP']},
  {n:'MOD ENV',     u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
  {n:'DELAY TIME',  u:'ms',   mn:10,   mx:2000,   df:200,  ep:false, sel:null},
  {n:'DELAY FDBK',  u:'%',   mn:0,    mx:95,     df:40,   ep:false, sel:null},
  {n:'REVERB SIZE', u:'%',   mn:0,    mx:100,    df:50,   ep:false, sel:null},
  {n:'REVERB MIX',  u:'%',   mn:0,    mx:100,    df:30,   ep:false, sel:null},
];

// ═══════════════════════════════════════════
// AUDIO UTILITIES
// ═══════════════════════════════════════════
function hz(v,mn,mx){return mn+(mx-mn)*Math.pow(Math.max(v,1)/mx,0.5)}

function makeDistCurve(depth,sym){
  const N=256,c=new Float32Array(N);
  const k=depth*200;
  for(let i=0;i<N;i++){
    const x=(i*2)/N-1;
    let y=Math.tanh(k*x);
    y+=Math.sin(x*Math.PI*2)*k*0.04*((100+sym)/100);
    y+=Math.sin(x*Math.PI*3)*k*0.02*((100-sym)/100);
    c[i]=Math.max(-1,Math.min(1,y/(1+k*0.08)));
  }
  return c;
}

function makeNoiseBuf(ctx,dur){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  return b;
}

function makePinkBuf(ctx,dur){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){
    const w=(Math.random()*2-1);
    b0=0.99886*b0+w*0.0555179;
    b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520;
    b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522;
    b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  return b;
}

// ═══════════════════════════════════════════
// SCHROEDER REVERB (fixed routing)
// ═══════════════════════════════════════════
class Reverb {
  constructor(ctx,out){
    this.ctx=ctx;
    this.out=out;
    // Comb filters in parallel
    const cT=[0.029,0.037,0.041,0.043];
    this.combs=[];
    const cb=[0.7,0.72,0.74,0.76];
    cT.forEach((t,i)=>{
      const c=ctx.createDelay(1);c.delayTime.value=t;
      const fb=ctx.createGain();fb.gain.value=cb[i];
      const g=ctx.createGain();g.gain.value=1;
      c.connect(fb);fb.connect(c);c.connect(g);
      this.combs.push({c,fb,g});
    });
    // Allpass in series
    const aT=[0.0031,0.005,0.007,0.009];
    this.allpasses=[];
    aT.forEach((t,i)=>{
      const d=ctx.createDelay(1);d.delayTime.value=t;
      const a=ctx.createGain();a.gain.value=-0.7;
      const g=ctx.createGain();g.gain.value=1;
      d.connect(a);a.connect(g);
      if(i>0)this.allpasses[i-1].g.connect(d);
      this.allpasses.push({d,a,g});
    });
    // Wire first allpass to first comb input
    this.allpasses[0].g.connect(this.combs[0].c);
    this.allpasses[0].g.connect(this.combs[1].c);
    this.allpasses[0].g.connect(this.combs[2].c);
    this.allpasses[0].g.connect(this.combs[3].c);
    // Sum combs → remaining allpasses
    const sum=ctx.createGain();sum.gain.value=1;
    this.combs.forEach(c=>c.g.connect(sum));
    sum.connect(this.allpasses[0].d);
    // Wet/dry mix
    this.wet=ctx.createGain();this.wet.gain.value=0.5;
    this.dry=ctx.createGain();this.dry.gain.value=0.5;
    this.allpasses[this.allpasses.length-1].g.connect(this.wet);
    this.wet.connect(this.out);
    this.dry.connect(this.out);
  }
  process(i){
    // i is the input → dry direct + wet through reverb chain
    i.connect(this.dry);
    i.connect(this.allpasses[0].d);
  }
  setDecay(s){
    const base=0.3+s*0.62;
    this.combs.forEach((c,i)=>{
      c.fb.gain.setTargetAtTime(Math.min(0.96,base+i*0.008),this.ctx.currentTime,0.05);
    });
  }
  setMix(w){
    this.wet.gain.setTargetAtTime(w,this.ctx.currentTime,0.05);
    this.dry.gain.setTargetAtTime(1-w,this.ctx.currentTime,0.05);
  }
}

// ═══════════════════════════════════════════
// LAYER VOICE
// ═══════════════════════════════════════════
class Layer {
  constructor(ctx,master,i){
    this.ctx=ctx;this.master=master;this.idx=i;
    this.p=PARAMS.map(x=>x.df);
    this.act=0;
    this._build();
  }

  _build(){
    const c=this.ctx;

    // Sources
    this.noiseA=c.createBufferSource();
    this.noiseA.buffer=makeNoiseBuf(c,4);
    this.noiseA.loop=true;

    this.noiseB=c.createBufferSource();
    this.noiseB.buffer=makePinkBuf(c,4);
    this.noiseB.loop=true;

    // Mix gains for noise blend
    this.gA=c.createGain();this.gA.gain.value=0.8;
    this.gB=c.createGain();this.gB.gain.value=0.2;

    // Shaping filter (color)
    this.shaper=c.createBiquadFilter();
    this.shaper.type='bandpass';this.shaper.frequency.value=800;this.shaper.Q.value=1.5;

    // Waveshaper
    this.ws=c.createWaveShaper();
    this.ws.curve=makeDistCurve(0,0);this.ws.oversample='4x';

    // Main filter
    this.flt=c.createBiquadFilter();
    this.flt.type='lowpass';this.flt.frequency.value=2500;this.flt.Q.value=0.5;

    // LFO
    this.lfoO=c.createOscillator();this.lfoO.type='sine';this.lfoO.frequency.value=1;
    this.lfoG=c.createGain();this.lfoG.gain.value=0;
    this.lfoO.connect(this.lfoG);this.lfoO.start();

    // Filter modulation envelope (LFO → filter)
    this.fltEnv=c.createGain();this.fltEnv.gain.value=1;
    this.lfoG.connect(this.fltEnv);
    this.fltEnv.connect(this.flt.frequency);

    // Amp envelope
    this.env=c.createGain();this.env.gain.value=0;

    // Grain AM
    this.grO=c.createOscillator();this.grO.frequency.value=20;
    this.grG=c.createGain();this.grG.gain.value=0;
    this.grO.connect(this.grG);this.grO.start();

    // Delay
    this.dly=c.createDelay(2);this.dly.delayTime.value=0.2;
    this.dlyFb=c.createGain();this.dlyFb.gain.value=0.4;
    this.dlyW=c.createGain();this.dlyW.gain.value=0.25;
    this.dlyD=c.createGain();this.dlyD.gain.value=0.75;
    this.dly.connect(this.dlyFb);this.dlyFb.connect(this.dly);
    this.dly.connect(this.dlyD);

    // OUTPUT
    this.out=c.createGain();this.out.gain.value=1;

    // Reverb
    this.rev=new Reverb(c,this.out);

    // Connect chain
    this.noiseA.connect(this.gA);
    this.noiseB.connect(this.shaper);this.shaper.connect(this.gB);
    this.gA.connect(this.ws);
    this.gB.connect(this.ws);
    this.ws.connect(this.flt);
    this.flt.connect(this.env);
    // env → direct delay path
    this.env.connect(this.dlyD);
    // env → delay send (wet)
    this.env.connect(this.dlyW);
    // delay send → reverb (wet path)
    this.dlyW.connect(this.rev.wet.gain);
    // Reverb processes its wet input AND routes to out
    this.rev.process(this.dlyW);
    this.out.connect(this.master);
  }

  _updParams(t){
    const p=this.p;
    // Noise blend
    const blend=p[1]/100;
    const naGain=Math.sqrt(1-blend);
    const nbGain=Math.sqrt(blend);
    this.gA.gain.setTargetAtTime(naGain,t,0.05);
    this.gB.gain.setTargetAtTime(nbGain,t,0.05);

    // Noise color / harm
    const nc=hz(p[0],20,20000);
    const harm=p[2]/100;
    this.shaper.frequency.setTargetAtTime(nc*(1+harm*0.5),t,0.05);
    this.shaper.Q.setTargetAtTime(0.5+harm*5,t,0.05);

    // Grain AM
    this.grO.frequency.setTargetAtTime(p[4],t,0.05);
    const gs=Math.max(0,p[3])/200;
    this.grG.gain.setTargetAtTime(gs,t,0.05);

    // Waveshaper
    this.ws.curve=makeDistCurve(p[10]/100,p[11]);

    // Filter
    const ftypes=['lowpass','bandpass','highpass','notch'];
    this.flt.type=ftypes[Math.floor(p[6])]||'lowpass';
    this.flt.frequency.setTargetAtTime(hz(p[7],20,20000),t,0.03);
    this.flt.Q.setTargetAtTime(0.3+p[8]/12,t,0.03);

    // Filter FM from LFO
    const lfoTarget=Math.floor(p[14]);
    const lfoDepth=p[13]/100;
    const fc=hz(p[7],20,20000);
    if(lfoTarget===1){this.lfoG.gain.setTargetAtTime(lfoDepth*fc*0.5,t,0.05);}
    else{this.lfoG.gain.setTargetAtTime(0,t,0.05);}

    // LFO rate
    this.lfoO.frequency.setTargetAtTime(Math.max(0.01,p[12]),t,0.05);

    // LFO pitch routing
    if(lfoTarget===0&&lfoDepth>0){
      this.lfoG.connect(this.shaper.frequency);
    } else {
      try{this.lfoG.disconnect(this.shaper.frequency);}catch(e){}
    }

    // Delay
    this.dly.delayTime.setTargetAtTime(Math.max(1,p[16])/1000,t,0.05);
    this.dlyFb.gain.setTargetAtTime(Math.max(0,Math.min(0.95,p[17]/100*0.95)),t,0.05);
    this.dlyW.gain.setTargetAtTime(Math.max(0,Math.min(0.8,p[17]/80)),t,0.05);

    // Reverb
    this.rev.setDecay(p[18]/100);
    this.rev.setMix(Math.max(0,Math.min(0.9,p[19]/100*0.8)));
  }

  _noteOn(vel){
    this.act=1;
    const c=this.ctx,t=c.currentTime;

    // Restart noise sources (ensures fresh buffer content)
    try{this.noiseA.stop();}catch(e){}
    this.noiseA=this._mkSrc('A');
    try{this.noiseB.stop();}catch(e){}
    this.noiseB=this._mkSrc('B');

    this._updParams(t);

    // Amp envelope — louder, more present
    this.env.gain.cancelScheduledValues(t);
    this.env.gain.setValueAtTime(0,t);
    this.env.gain.linearRampToValueAtTime(Math.max(0.001,vel)*0.3,t+0.005);
    this.env.gain.exponentialRampToValueAtTime(0.0001,t+1.0);

    // Re-trigger LFO for fresh phase
    try{this.lfoO.stop();}catch(e){}
    this.lfoO=c.createOscillator();this.lfoO.type='sine';
    this.lfoO.frequency.value=this.p[12];
    this.lfoG=c.createGain();this.lfoG.gain.value=0;
    this.lfoO.connect(this.lfoG);this.lfoO.start();
    this.lfoG.connect(this.fltEnv);
    // Reconnect filter FM
    const lfoTarget=Math.floor(this.p[14]);
    if(lfoTarget===1){
      const fc=hz(this.p[7],20,20000);
      this.lfoG.gain.value=this.p[13]/100*fc*0.5;
    }

    // Re-trigger grain LFO
    try{this.grO.stop();}catch(e){}
    this.grO=c.createOscillator();
    this.grO.frequency.value=this.p[4];
    this.grG=c.createGain();this.grG.gain.value=this.p[3]/200;
    this.grO.connect(this.grG);this.grO.start();
    this.grG.connect(this.env.gain);
  }

  _mkSrc(type){
    const c=this.ctx;
    const src=c.createBufferSource();
    src.buffer=(type==='A')?makeNoiseBuf(c,4):makePinkBuf(c,4);
    src.loop=true;
    if(type==='A'){
      src.connect(this.gA);
    } else {
      src.connect(this.shaper);
    }
    src.start();
    return src;
  }

  _noteOff(){
    this.act=0;
    const c=this.ctx,t=c.currentTime;
    this.env.gain.cancelScheduledValues(t);
    this.env.gain.setValueAtTime(this.env.gain.value,t);
    this.env.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  }

  setP(i,v){
    if(isNaN(v)||!isFinite(v))return; // guard against NaN
    this.p[i]=v;
    if(this.act)this._updParams(this.ctx.currentTime);
  }
}

// ═══════════════════════════════════════════
// SYNTH ENGINE
// ═══════════════════════════════════════════
class Alphosynth {
  constructor(){
    this.ctx=null;this.master=null;this.layers=[];
    this.cur=0;this.on=false;
    this.notes=new Map();
    this._buildUI();
  }

  async init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain();
    this.master.gain.setValueAtTime(0.75,this.ctx.currentTime);
    this.master.connect(this.ctx.destination);
    for(let i=0;i<5;i++)this.layers.push(new Layer(this.ctx,this.master,i));
  }

  _start(){
    if(this.on)return;
    this.init();
    if(this.ctx.state==='suspended')this.ctx.resume();
    this.on=true;
    document.getElementById('pwr-btn').classList.add('on');
    document.getElementById('pwr-btn').textContent='AUDIO ON';
    document.getElementById('triggers').style.display='flex';
    document.getElementById('mode-bar').style.display='flex';
    document.getElementById('main').style.display='grid';
    this.layers.forEach(l=>l._updParams(this.ctx.currentTime));
  }

  _stop(){
    if(!this.ctx)return;
    this.notes.forEach((_,n)=>this._noteOff(n));
    this.on=false;
    document.getElementById('pwr-btn').classList.remove('on');
    document.getElementById('pwr-btn').textContent='AUDIO OFF';
  }

  _noteOn(n,vel=0.7){
    if(!this.on||!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const li=this.cur++%5;
    this.layers[li]._noteOn(vel);
    this.notes.set(n,li);
    this._updateVis();
  }

  _noteOff(n){
    if(!this.on)return;
    const li=this.notes.get(n);
    if(li!==undefined){this.layers[li]._noteOff();this.notes.delete(n);}
    this._updateVis();
  }

  setP(li,i,v){this.layers[li].setP(i,v);}

  setMaster(v){
    if(this.master)this.master.gain.setTargetAtTime(v/100,this.ctx.currentTime,0.03);
  }

  _updateVis(){
    const c=[0,0,0,0,0];
    this.notes.forEach(li=>c[li]++);
    const visi=document.getElementById('visi');
    if(!visi)return;
    const cols=['vcol0','vcol1','vcol2','vcol3','vcol4'];
    visi.innerHTML=c.map((v,i)=>`<span class="${cols[i]}" style="flex:${v||0.1}"></span>`).join('');
  }

  // ─── UI ─────────────────────────────────────
  _buildUI(){
    const grid=document.getElementById('main');
    grid.innerHTML='';

    PARAMS.forEach((pr,i)=>{
      const cell=document.createElement('div');cell.className='kcell';
      const k=document.createElement('div');k.className='knob';k.dataset.i=i;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 54 54');
      svg.innerHTML=`<circle cx="27" cy="27" r="24" fill="none" stroke="#222" stroke-width="3"/>
        <circle id="a${i}" cx="27" cy="27" r="24" fill="none" stroke="#e63946" stroke-width="3"
          stroke-dasharray="0 150.8" transform="rotate(-135 27 27)" stroke-linecap="round"/>`;
      k.appendChild(svg);
      const kv=document.createElement('div');kv.className='kval';
      kv.id=`v${i}`;kv.innerHTML='<span></span>';
      k.appendChild(kv);
      const kn=document.createElement('div');kn.className='kname';
      kn.id=`n${i}`;kn.textContent=pr.n;
      cell.appendChild(k);cell.appendChild(kn);
      grid.appendChild(cell);

      cell.addEventListener('mouseenter',()=>{
        document.getElementById('pname').textContent=pr.n;
        this._updPD(i);
      });

      if(pr.sel){
        k.addEventListener('dblclick',()=>this._openSel(k,i));
      }

      this._dragKnob(k,i);
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(t=>{
      t.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        this._refreshKnobs();
      });
    });

    // Power button (bottom-center, clear labels)
    document.getElementById('pwr-btn').addEventListener('click',()=>{
      this.on?this._stop():this._start();
    });

    // Master vol
    document.getElementById('mv').addEventListener('input',e=>{
      this.setMaster(+e.target.value);
    });

    // Start button
    document.getElementById('start-btn').addEventListener('click',()=>{
      document.getElementById('start').style.display='none';
      this._start();
      document.getElementById('vis').style.display='block';
    });

    // Trigger grid (replaces keyboard)
    this._buildTriggers();

    // Sequencer
    this._buildSeq();

    // Mode toggle
    document.getElementById('mode-trig').addEventListener('click',()=>{
      document.getElementById('mode-trig').classList.add('active');
      document.getElementById('mode-seq').classList.remove('active');
      document.getElementById('triggers').style.display='flex';
      document.getElementById('seq').classList.remove('visible');
    });
    document.getElementById('mode-seq').addEventListener('click',()=>{
      document.getElementById('mode-seq').classList.add('active');
      document.getElementById('mode-trig').classList.remove('active');
      document.getElementById('triggers').style.display='none';
      document.getElementById('seq').classList.add('visible');
    });

    this._updateVis();
  }

  _openSel(k,i){
    document.querySelectorAll('.psel').forEach(s=>s.remove());
    const pr=PARAMS[i],sel=document.createElement('div');
    sel.className='psel open';sel.style.position='absolute';
    pr.sel.forEach((o,vi)=>{
      const btn=document.createElement('button');
      btn.textContent=o;
      btn.addEventListener('click',()=>{
        this.setP(this._curL(),i,vi);
        this._refreshKnobs();
        sel.remove();
      });
      sel.appendChild(btn);
    });
    k.parentElement.appendChild(sel);
    setTimeout(()=>{document.addEventListener('click',function h(e){
      if(!sel.contains(e.target)){sel.remove();document.removeEventListener('click',h);}
    });},10);
  }

  _curL(){return+document.querySelector('.tab.active').dataset.i}

  // FIXED KNOB DRAG — NaN guard, 300px = full range, shift = fine
  _dragKnob(el,i){
    let startY=0,startV=0,dragging=false;
    const rng=PARAMS[i].mx-PARAMS[i].mn;

    el.addEventListener('mousedown',e=>{dragging=true;startY=e.clientY;startV=this.layers[this._curL()].p[i];e.preventDefault();});
    el.addEventListener('touchstart',e=>{dragging=true;startY=e.touches[0].clientY;startV=this.layers[this._curL()].p[i];e.preventDefault();},{passive:false});

    const onMove=(clientY,shiftKey)=>{
      if(!dragging)return;
      // 300px drag = full range; shift = 1/20 speed
      const pxPerFull=300;
      const norm=(startV-PARAMS[i].mn)/Math.max(rng,0.001);
      const delta=(startY-clientY)/pxPerFull;
      const ns=shiftKey?0.05:1;
      let nv=norm+delta*ns;
      nv=Math.max(0,Math.min(1,nv));
      const nextV=PARAMS[i].mn+nv*rng;
      // Guard: skip NaN/Inf
      if(isNaN(nextV)||!isFinite(nextV))return;
      // Snap to step (avoid NaN from df=0)
      const df=PARAMS[i].df||1;
      const step=rng/100;
      const snapped=Math.round(nextV/step)*step;
      const clamped=Math.max(PARAMS[i].mn,Math.min(PARAMS[i].mx,snapped));
      if(isNaN(clamped)||!isFinite(clamped))return;
      this.setP(this._curL(),i,clamped);
      this._refreshKnob(i);
      this._updPD(i);
    };

    window.addEventListener('mousemove',e=>{if(e.buttons)onMove(e.clientY,e.shiftKey);});
    window.addEventListener('touchmove',e=>{if(e.touches.length)onMove(e.touches[0].clientY,false);},{passive:false});
    window.addEventListener('mouseup',()=>dragging=false);
    window.addEventListener('touchend',()=>dragging=false);
  }

  _refreshKnobs(){
    PARAMS.forEach((_,i)=>this._refreshKnob(i));
  }

  _refreshKnob(i){
    const pr=PARAMS[i],li=this._curL(),v=this.layers[li].p[i];
    if(isNaN(v)||!isFinite(v))return;
    const norm=(v-pr.mn)/Math.max(pr.mx-pr.mn,0.001);
    const arc=document.getElementById(`a${i}`);
    if(arc){
      const len=Math.max(0,Math.min(1,norm))*113.1;
      arc.setAttribute('stroke-dasharray',`${len} 150.8`);
      arc.setAttribute('stroke',pr.sel?'#457b9d':'#e63946');
    }
    const kv=document.getElementById(`v${i}`);
    if(kv){
      if(pr.sel)kv.innerHTML=`<span>${pr.sel[Math.round(v)]||''}</span>`;
      else{
        if(pr.mx>=10000)kv.innerHTML=`<span>${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</span>`;
        else if(pr.mx<1)kv.innerHTML=`<span>${v.toFixed(2)}</span>`;
        else kv.innerHTML=`<span>${Math.round(v*10)/10}</span>`;
      }
    }
  }

  _updPD(i){
    const pr=PARAMS[i],li=this._curL(),v=this.layers[li].p[i];
    if(isNaN(v)||!isFinite(v))return;
    const pv=document.getElementById('pval');
    if(pr.sel)pv.textContent=pr.sel[Math.round(v)]||'';
    else{
      let s='';
      if(pr.mx>=1000&&v>=1000)s=(v/1000).toFixed(1)+'k';
      else if(pr.mx<1)s=v.toFixed(2);
      else s=Math.round(v*10)/10;
      pv.textContent=s+(pr.u?' '+pr.u:'');
    }
  }

  // ─── TRIGGER GRID (replaces piano keyboard) ─────────────────────
  _buildTriggers(){
    const rows=document.getElementById('triggers');
    // 4 rows × 4 cols of triggers — each fires a noise burst
    // Row 0: Layer 1-4, Row 1: Layer 1-4, etc (4 banks)
    const bankLabels=['A','B','C','D'];
    const colors=['#e63946','#457b9d','#f4a261','#2a9d8f'];
    bankLabels.forEach((label,bi)=>{
      const row=document.getElementById(`trig-row-${bi}`);
      row.innerHTML='';
      // Column label
      for(let col=0;col<4;col++){
        const cell=document.createElement('div');cell.className='trig-cell';
        const label2=document.createElement('span');label2.textContent=`L${col+1}`;
        const btn=document.createElement('button');btn.className='trig';
        btn.style.setProperty('--c',colors[col]);
        btn.dataset.layer=col;
        btn.dataset.bank=bi;
        btn.textContent=`${label}${col+1}`;
        btn.style.borderColor='#222';
        // Color accent on hover
        btn.addEventListener('mouseenter',()=>{if(!btn.classList.contains('firing'))btn.style.borderColor=colors[col];});
        btn.addEventListener('mouseleave',()=>{if(!btn.classList.contains('firing'))btn.style.borderColor='#222';});
        // Fire on press (mouse + touch)
        const fire=(e)=>{
          if(!this.on)return;
          if(this.ctx.state==='suspended')this.ctx.resume();
          const layer=col;
          this.layers[layer]._noteOn(0.7);
          btn.classList.add('firing');
          setTimeout(()=>btn.classList.remove('firing'),150);
        };
        btn.addEventListener('mousedown',e=>{e.preventDefault();fire(e);});
        btn.addEventListener('touchstart',e=>{e.preventDefault();fire(e);},{passive:false});
        cell.appendChild(label2);
        cell.appendChild(btn);
        row.appendChild(cell);
      }
    });
  }

  // ─── STEP SEQUENCER ─────────────────────────────────────────────
  _buildSeq(){
    const grid=document.getElementById('seq-grid');
    grid.innerHTML='';
    this.seqSteps=16; // 16 steps
    this.seqData=[]; // seqData[step][layer] = active bool

    // 5 rows (one per layer) × 16 steps
    PARAMS.slice(0,5).forEach((pr,li)=>{
      this.seqData[li]=new Array(this.seqSteps).fill(false);
      const row=document.createElement('div');row.className='seq-row';
      const lbl=document.createElement('div');lbl.className='seq-label';
      lbl.textContent=`L${li+1}`;
      row.appendChild(lbl);
      for(let s=0;s<this.seqSteps;s++){
        const btn=document.createElement('button');btn.className='seq-step';
        btn.dataset.li=li;btn.dataset.s=s;
        btn.addEventListener('click',()=>{
          this.seqData[li][s]=!this.seqData[li][s];
          btn.classList.toggle('active',this.seqData[li][s]);
        });
        row.appendChild(btn);
      }
      grid.appendChild(row);
    });

    this.seqPlaying=false;
    this.seqIdx=0;
    this._seqTimeout=null;

    document.getElementById('seq-clear').addEventListener('click',()=>{
      this.seqData.forEach((row)=>row.fill(false));
      document.querySelectorAll('.seq-step').forEach(b=>b.classList.remove('active'));
    });

    document.getElementById('seq-play').addEventListener('click',()=>{
      if(this.seqPlaying)return;
      if(!this.on)this._start();
      if(this.ctx.state==='suspended')this.ctx.resume();
      this.seqPlaying=true;
      this._seqTick();
    });

    document.getElementById('seq-stop').addEventListener('click',()=>{
      this.seqPlaying=false;
      if(this._seqTimeout)clearTimeout(this._seqTimeout);
      document.querySelectorAll('.seq-step').forEach(b=>b.classList.remove('playhead'));
    });
  }

  _seqTick(){
    if(!this.seqPlaying)return;
    document.querySelectorAll('.seq-step.playhead').forEach(b=>b.classList.remove('playhead'));
    const step=this.seqIdx;
    // Fire active layers for this step
    this.seqData.forEach((row,li)=>{
      if(row[step]){
        this.layers[li]._noteOn(0.7);
      }
      const btn=document.querySelector(`.seq-step[data-li="${li}"][data-s="${step}"]`);
      if(btn)btn.classList.add('playhead');
    });
    // Advance
    this.seqIdx=(this.seqIdx+1)%this.seqSteps;
    const bpm=120;
    const ms=30000/bpm/4; // 16th notes
    this._seqTimeout=setTimeout(()=>this._seqTick(),ms);
  }
}

// ═══════════════════════════════════════════
const synth=new Alphosynth();
window.synth=synth;
